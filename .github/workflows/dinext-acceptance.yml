name: Dinext acceptance
on:
  workflow_call: {}
  workflow_dispatch: {}
permissions:
  contents: read
concurrency:
  group: workflow-acceptance-${{ github.ref }}
  cancel-in-progress: true
jobs:
  cypress:
    name: Cypress acceptance
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    services:
      mariadb:
        image: mariadb:10.6
        env:
          MYSQL_ROOT_PASSWORD: ci
          MYSQL_ROOT_HOST: '%'
        ports: ['3306:3306']
        options: --health-cmd="mysqladmin ping -h localhost -pci" --health-interval=10s --health-timeout=5s --health-retries=12
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
    env:
      CI: 'true'
      DINEXT_DEPLOY_ENABLED: 'false'
      DINEXT_NOTIFICATIONS_ENABLED: 'false'
      DINEXT_DOCS_AGENT_ENABLED: '0'
      DINEXT_WIKI_PUBLISH_ENABLED: '0'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Check out the shared bench runner
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: Dinext-pro/dinext-common
          ref: c080095bd61ea5cc89b1bb9ef12e809ea00e68ce
          path: .ci-support
          persist-credentials: false
          sparse-checkout: .github/ci
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Install isolated test tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq mariadb-client libmariadb-dev libmariadb-dev-compat libxml2-dev libxslt1-dev libffi-dev libjpeg-dev zlib1g-dev redis-tools xvfb xauth libgtk-3-0t64 libgbm1 libnss3 libasound2t64 libxss1 libxtst6 libatk-bridge2.0-0t64 libnotify4
          python -m pip install frappe-bench==5.31.0
          npm install --global yarn@1.22.22
          sudo install -d -o "$(id -un)" -g "$(id -gn)" /home/frappe
          ln -s "$RUNNER_TEMP/dinext-test-bench" /home/frappe/frappe-bench
      - name: Run server and browser acceptance
        run: python ./.github/ci/workflow_acceptance.py "$GITHUB_WORKSPACE" "$GITHUB_WORKSPACE/.ci-support/.github/ci"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: workflow-acceptance
          path: |
            ${{ runner.temp }}/*-unit.xml
            ${{ runner.temp }}/workflow-acceptance/
          if-no-files-found: error
          retention-days: 14
  sidebar:
    name: Sidebar Cypress
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          path: common
          persist-credentials: false
      - name: Select the pinned platform from the CI catalog
        id: platform
        run: |
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          platform = json.loads(Path('common/.github/ci/public-apps.json').read_text())['frappe']
          assert platform['repository'] == 'https://github.com/Dinext-pro/dinext_platform.git'
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write('ref=' + platform['ci_sha'] + '\n')
          PY
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: Dinext-pro/dinext_platform
          ref: ${{ steps.platform.outputs.ref }}
          path: frappe
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Install platform rendering dependencies and Cypress
        run: |
          npm install --global yarn@1.22.22
          yarn --cwd frappe install --frozen-lockfile
          npm install --prefix "$RUNNER_TEMP/sidebar-tools" --no-save cypress@13.17.0
      - name: Run the sidebar rendering scenarios
        run: |
          python3 -m http.server 8000 --bind 127.0.0.1 --directory "$RUNNER_TEMP" > "$RUNNER_TEMP/sidebar-http.log" 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid"' EXIT
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://localhost:8000/ > /dev/null; then break; fi
            sleep 1
          done
          "$RUNNER_TEMP/sidebar-tools/node_modules/.bin/cypress" run --browser electron --project common --config-file cypress.sidebar.config.cjs
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET
          files = list(Path('common/cypress/results').glob('workspace-sidebar-*.xml'))
          assert files, 'Missing Cypress JUnit report'
          cases = [case for file in files for case in ET.parse(file).iter('testcase')]
          assert len(cases) == 4, f'Expected four sidebar scenarios, found {len(cases)}'
          assert all(not list(case) for case in cases), 'A sidebar scenario failed or was skipped'
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: sidebar-cypress-results
          path: |
            common/cypress/results/
            common/cypress/screenshots/
          if-no-files-found: error
          retention-days: 14
