name: Dinext validation support
on:
  workflow_call:
    inputs:
      support_ref:
        type: string
        required: true
      mode:
        type: string
        required: true
      frontend_tests:
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  checks:
    name: Repository checks
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        if: github.repository != 'Dinext-pro/dinext_wiki'
        with:
          persist-credentials: false
      - name: Checkout preserved legacy Wiki tree
        if: github.repository == 'Dinext-pro/dinext_wiki'
        # The preserved source contains an unregistered worktrees gitlink.
        # Fetch the public tree without submodule traversal or credentials.
        run: |
          git init .
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git fetch --no-tags --depth=1 origin "$GITHUB_SHA"
          git checkout --detach FETCH_HEAD
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: Dinext-pro/dinext-common
          ref: ${{ inputs.support_ref }}
          path: ci-support
          persist-credentials: false
          sparse-checkout: .github/ci
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Check repository and branch policy
        run: python ci-support/.github/ci/check_repository.py "$GITHUB_WORKSPACE"
  unit:
    name: App unit tests
    if: inputs.mode == 'frappe-app' || inputs.mode == 'platform-smoke'
    needs: checks
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    services:
      mariadb:
        image: mariadb:10.6
        env:
          MYSQL_ROOT_PASSWORD: ci
          MYSQL_ROOT_HOST: '%'
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -pci"
          --health-interval=10s --health-timeout=5s --health-retries=12
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: Dinext-pro/dinext-common
          ref: ${{ inputs.support_ref }}
          path: ci-support
          persist-credentials: false
          sparse-checkout: .github/ci
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '20'
      - name: Install test environment tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq mariadb-client libmariadb-dev libmariadb-dev-compat libxml2-dev libxslt1-dev libffi-dev libjpeg-dev zlib1g-dev redis-tools
          python -m pip install frappe-bench==5.31.0
          npm install --global yarn@1.22.22
          # Existing app logging uses the original container's absolute bench path.
          # Preserve that path only inside the disposable hosted runner.
          sudo install -d -o "$(id -un)" -g "$(id -gn)" /home/frappe
          ln -s "$RUNNER_TEMP/dinext-test-bench" /home/frappe/frappe-bench
      - name: Install ephemeral bench and run tests
        env:
          CI: 'true'
          DINEXT_DEPLOY_ENABLED: 'false'
          DINEXT_NOTIFICATIONS_ENABLED: 'false'
          DINEXT_DOCS_AGENT_ENABLED: '0'
          DINEXT_WIKI_PUBLISH_ENABLED: '0'
        run: python ci-support/.github/ci/bench_tests.py "$GITHUB_WORKSPACE"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: app-unit-results
          path: ${{ runner.temp }}/*-unit.xml
          if-no-files-found: ignore
          retention-days: 14
  python-tests:
    name: Python unit tests
    if: inputs.mode == 'python-project'
    needs: checks
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[dev]' python-gitlab PyGithub
      - run: python -m pytest -q --junitxml=python-unit.xml
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: python-unit-results
          path: python-unit.xml
          if-no-files-found: ignore
          retention-days: 14
  portable:
    name: Portable wheel
    if: inputs.mode == 'portable'
    needs: checks
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - run: |
          python -m pip wheel --no-deps --wheel-dir dist .
          python scripts/check-portable-wheel.py
          python -m pip install --no-deps dist/*.whl
          python -I -c "from frappe_better_select_control import __version__; print(__version__)"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: portable-wheel
          path: dist/*.whl
          retention-days: 30
  frontend:
    name: Frontend unit tests
    if: inputs.frontend_tests
    needs: checks
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          path: crm
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: Dinext-pro/dinext_platform
          ref: main/v15
          path: frappe
          sparse-checkout: ui
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - run: npm install --global yarn@1.22.22
      - working-directory: crm/frontend
        run: |
          yarn install --frozen-lockfile
          yarn test:run --reporter=default --reporter=junit --outputFile=frontend-unit.xml
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: frontend-unit-results
          path: crm/frontend/frontend-unit.xml
          if-no-files-found: ignore
          retention-days: 14
