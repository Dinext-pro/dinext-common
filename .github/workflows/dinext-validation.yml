name: Dinext validation
'on':
  push:
    branches:
    - main
    - develop
    - main/**
    - release/**
  pull_request: {}
  workflow_dispatch: {}
permissions:
  contents: read
concurrency:
  group: dinext-validation-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validation:
    name: Validation
    uses: ./.github/workflows/dinext-reusable.yml
    with:
      support_ref: ${{ github.sha }}
      mode: frappe-app
      frontend_tests: false
      privacy_baselines: ${{ vars.DINEXT_PRIVACY_BASELINES }}
    secrets:
      DINEXT_PRIVACY_DENYLIST: ${{ secrets.DINEXT_PRIVACY_DENYLIST }}
