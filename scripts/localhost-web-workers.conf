# User drop-in for dinext-web.service on the local Dinext bench.
# Install scripts/localhost-web-requirements.txt in the bench environment first.
# Python changes restart the web process through native filesystem events.
[Service]
WorkingDirectory=%h/mybench/sites
ExecStart=
ExecStart=%h/mybench/env/bin/python %h/mybench/apps/dinext_common/scripts/serve_local_web.py
